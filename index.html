<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>映像・音声 個別再生テスト</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #222;
      background: #f4f5f7;
    }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .note { color: #555; margin: 0 0 24px; }
    section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin: 18px 0;
    }
    h2 { font-size: 1.15rem; margin: 0 0 12px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font: inherit;
    }
    button {
      padding: 9px 16px;
      border: 1px solid #999;
      border-radius: 5px;
      background: #eee;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #e2e2e2; }
    video { display: block; width: 100%; max-height: 480px; background: #000; }
    audio { display: block; width: 100%; }
    .status { min-height: 1.4em; margin: 9px 0 0; color: #555; font-size: .9rem; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    @media (max-width: 560px) {
      body { padding: 14px; }
      .input-row { flex-direction: column; }
      .input-row button { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <h1>映像・音声 個別再生テスト</h1>
  <p class="note">映像と音声を別々のプレイヤーで読み込みます。片方だけでも再生できます。</p>

  <section>
    <h2>映像プレイヤー</h2>
    <div class="input-row">
      <input id="videoUrl" type="url" placeholder="映像URLを入力" autocomplete="off">
      <button id="loadVideo" type="button">映像を読み込む</button>
    </div>
    <video id="videoPlayer" controls playsinline preload="metadata"></video>
    <p id="videoStatus" class="status">映像URLを入力してください。</p>
  </section>

  <section>
    <h2>音声プレイヤー</h2>
    <div class="input-row">
      <input id="audioUrl" type="url" placeholder="音声URLを入力" autocomplete="off">
      <button id="loadAudio" type="button">音声を読み込む</button>
    </div>
    <audio id="audioPlayer" controls preload="metadata"></audio>
    <p id="audioStatus" class="status">音声URLを入力してください。</p>
  </section>

  <div class="actions">
    <button id="clearAll" type="button">両方クリア</button>
  </div>
</main>

<script>
  const videoInput = document.getElementById("videoUrl");
  const audioInput = document.getElementById("audioUrl");
  const video = document.getElementById("videoPlayer");
  const audio = document.getElementById("audioPlayer");
  const videoStatus = document.getElementById("videoStatus");
  const audioStatus = document.getElementById("audioStatus");

  function loadMedia(input, media, status, label) {
    const url = input.value.trim();

    if (!url) {
      status.textContent = label + "URLを入力してください。";
      return;
    }

    try {
      const parsed = new URL(url);
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
        throw new Error("HTTP/HTTPS以外のURLは使えません。");
      }
    } catch (error) {
      status.textContent = "URLを確認してください: " + error.message;
      return;
    }

    media.pause();
    media.removeAttribute("src");
    media.load();

    media.src = url;
    media.load();
    status.textContent = "読み込みを開始しました。";
  }

  document.getElementById("loadVideo").addEventListener("click", () => {
    loadMedia(videoInput, video, videoStatus, "映像");
  });

  document.getElementById("loadAudio").addEventListener("click", () => {
    loadMedia(audioInput, audio, audioStatus, "音声");
  });

  video.addEventListener("loadedmetadata", () => {
    videoStatus.textContent =
      "映像を読み込みました。長さ: " + formatTime(video.duration);
  });
  audio.addEventListener("loadedmetadata", () => {
    audioStatus.textContent =
      "音声を読み込みました。長さ: " + formatTime(audio.duration);
  });

  video.addEventListener("canplay", () => {
    videoStatus.textContent = "映像を再生できます。";
  });
  audio.addEventListener("canplay", () => {
    audioStatus.textContent = "音声を再生できます。";
  });

  video.addEventListener("waiting", () => {
    videoStatus.textContent = "映像をバッファリング中...";
  });
  audio.addEventListener("waiting", () => {
    audioStatus.textContent = "音声をバッファリング中...";
  });

  video.addEventListener("error", () => {
    videoStatus.textContent = mediaErrorMessage(video);
  });
  audio.addEventListener("error", () => {
    audioStatus.textContent = mediaErrorMessage(audio);
  });

  document.getElementById("clearAll").addEventListener("click", () => {
    for (const media of [video, audio]) {
      media.pause();
      media.removeAttribute("src");
      media.load();
    }
    videoInput.value = "";
    audioInput.value = "";
    videoStatus.textContent = "映像URLを入力してください。";
    audioStatus.textContent = "音声URLを入力してください。";
  });

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "不明";
    const minutes = Math.floor(seconds / 60);
    const remaining = Math.floor(seconds % 60);
    return minutes + ":" + String(remaining).padStart(2, "0");
  }

  function mediaErrorMessage(media) {
    if (!media.error) return "メディアの読み込みに失敗しました。";
    const messages = {
      1: "読み込みが中止されました。",
      2: "ネットワークエラーです。URLや通信状態を確認してください。",
      3: "デコードできません。形式やファイルの破損を確認してください。",
      4: "この形式またはURLはブラウザで再生できません。"
    };
    return messages[media.error.code] || "再生エラーが発生しました。";
  }
</script>
</body>
</html>
