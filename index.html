
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piped Server Checker</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #111827;
  color: #f9fafb;
  font-family: sans-serif;
}

main {
  max-width: 850px;
  margin: auto;
}

h1 { font-size: 25px; }

textarea {
  width: 100%;
  height: 220px;
  padding: 14px;
  background: #1f2937;
  color: white;
  border: 1px solid #4b5563;
  border-radius: 10px;
  resize: vertical;
  font-size: 14px;
  font-family: monospace;
}

input {
  padding: 10px;
  width: 100%;
  background: #1f2937;
  color: white;
  border: 1px solid #4b5563;
  border-radius: 8px;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.start { background: #2563eb; color: white; }
.copy { background: #374151; color: white; }
.stop { background: #991b1b; color: white; }

.stats {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin: 20px 0;
}

.stat {
  background: #1f2937;
  padding: 12px;
  border-radius: 8px;
}

.number {
  font-size: 25px;
  font-weight: bold;
}

#progress {
  height: 9px;
  background: #374151;
  border-radius: 10px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0%;
  background: #3b82f6;
}

.result {
  background: #1f2937;
  padding: 13px;
  margin: 8px 0;
  border-radius: 8px;
  overflow-wrap: anywhere;
  border-left: 5px solid #6b7280;
}

.ok { border-color: #22c55e; }
.ng { border-color: #ef4444; }
.unknown { border-color: #eab308; }

.small {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 5px;
}

.badge {
  font-weight: bold;
}

@media(max-width:500px) {
  .stats { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>
<main>

<h1>Piped Server Checker</h1>
<p>URLを1行ずつ入力してください。</p>

<textarea id="urls" placeholder="https://pipedapi.example.com
https://another-piped-api.example
https://example.org/streams/aqz-KE-BPKQ"></textarea>

<p>検査する動画ID</p>
<input id="video" value="aqz-KE-BPKQ">

<p>
<button class="start" id="start" onclick="startTest()">検査開始</button>
<button class="stop" onclick="stopTest()">停止</button>
<button class="copy" onclick="copyResults()">結果をコピー</button>
</p>

<div class="stats">
  <div class="stat">
    成功<div class="number" id="success">0</div>
  </div>
  <div class="stat">
    失敗<div class="number" id="failed">0</div>
  </div>
  <div class="stat">
    判定不能<div class="number" id="unknown">0</div>
  </div>
  <div class="stat">
    検査済み<div class="number" id="checked">0</div>
  </div>
</div>

<div id="progress"><div id="bar"></div></div>
<p id="status">待機中</p>
<div id="results"></div>

</main>

<script>
let results = [];
let stopped = false;
let running = false;

function makeURL(input, video) {
  let url = input.trim();

  if (!url) return null;

  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }

  const parsed = new URL(url);

  if (!["http:", "https:"].includes(parsed.protocol)) {
    throw new Error("対応していないURL形式");
  }

  // 既にstreamsのURLなら動画IDだけ変更
  const match = parsed.pathname.match(/\/streams\/[^/]+\/?$/);

  if (match) {
    parsed.pathname =
      parsed.pathname.replace(/\/streams\/[^/]+\/?$/, "") +
      "/streams/" + encodeURIComponent(video);
  } else {
    parsed.pathname =
      parsed.pathname.replace(/\/+$/, "") +
      "/streams/" + encodeURIComponent(video);
  }

  parsed.search = "";
  parsed.hash = "";

  return parsed.href;
}

async function test(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    const response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    });

    if (!response.ok) {
      return {
        result: "failed",
        status: response.status,
        error: "HTTP " + response.status
      };
    }

    const data = await response.json();

    if (
      data &&
      typeof data === "object" &&
      (
        Array.isArray(data.videoStreams) ||
        Array.isArray(data.audioStreams) ||
        Array.isArray(data.relatedStreams)
      )
    ) {
      return {
        result: "success",
        status: response.status,
        error: ""
      };
    }

    return {
      result: "failed",
      status: response.status,
      error: "動画情報のJSONではありません"
    };

  } catch (e) {
    return {
      result: "unknown",
      status: null,
      error: e.name === "AbortError"
        ? "タイムアウト"
        : e.message
    };

  } finally {
    clearTimeout(timer);
  }
}

function render(item, index) {
  const div = document.createElement("div");
  div.className = "result " +
    (item.result === "success" ? "ok" :
    item.result === "failed" ? "ng" : "unknown");

  const labels = {
    success: "成功",
    failed: "失敗",
    unknown: "判定不能"
  };

  const title = document.createElement("div");
  title.className = "badge";
  title.textContent = (index + 1) + ". " + labels[item.result];

  const link = document.createElement("div");
  link.className = "small";
  link.textContent = item.url || "URL不明";

  const detail = document.createElement("div");
  detail.textContent =
    "HTTP: " + (item.status ?? "取得不可") +
    " / " + (item.error || "正常なJSONを確認");

  div.append(title, link, detail);

  document.getElementById("results").appendChild(div);
}

function updateStats() {
  document.getElementById("success").textContent =
    results.filter(x => x.result === "success").length;

  document.getElementById("failed").textContent =
    results.filter(x => x.result === "failed").length;

  document.getElementById("unknown").textContent =
    results.filter(x => x.result === "unknown").length;

  document.getElementById("checked").textContent =
    results.length;
}

async function startTest() {
  if (running) return;

  const lines = document.getElementById("urls")
    .value.split(/\r?\n/)
    .map(x => x.trim())
    .filter(x => x && !x.startsWith("#"));

  const video = document.getElementById("video").value.trim();

  if (!lines.length) {
    alert("URLを入力してください");
    return;
  }

  if (!video || video.includes("/")) {
    alert("動画IDを正しく入力してください");
    return;
  }

  results = [];
  stopped = false;
  running = true;

  document.getElementById("results").innerHTML = "";
  document.getElementById("bar").style.width = "0%";
  document.getElementById("start").disabled = true;

  const urls = lines.map(line => {
    try {
      return {url: makeURL(line, video)};
    } catch (e) {
      return {url: line, error: e.message};
    }
  });

  let next = 0;
  let completed = 0;

  async function worker() {
    while (!stopped) {
      const i = next++;
      if (i >= urls.length) break;

      let item;

      if (urls[i].error) {
        item = {
          url: urls[i].url,
          result: "failed",
          status: null,
          error: urls[i].error
        };
      } else {
        const checked = await test(urls[i].url);

        item = {
          url: urls[i].url,
          ...checked
        };
      }

      results[i] = item;
      completed++;

      render(item, i);
      updateStats();

      document.getElementById("bar").style.width =
        (completed / urls.length * 100) + "%";

      document.getElementById("status").textContent =
        completed + " / " + urls.length + " 検査完了";
    }
  }

  await Promise.all(
    Array.from(
      {length: Math.min(5, urls.length)},
      () => worker()
    )
  );

  running = false;
  document.getElementById("start").disabled = false;

  document.getElementById("status").textContent =
    stopped
      ? "検査を停止しました"
      : "すべての検査が完了しました";
}

function stopTest() {
  stopped = true;
}

async function copyResults() {
  if (!results.length) {
    alert("コピーする結果がありません");
    return;
  }

  const output = results.map(r => ({
    url: r.url,
    result: r.result,
    status: r.status,
    error: r.error
  }));

  try {
    await navigator.clipboard.writeText(
      JSON.stringify(output, null, 2)
    );
    alert("結果をコピーしました");
  } catch(e) {
    alert("コピーできませんでした。HTTPS環境で試してください");
  }
}
</script>
</body>
</html>
