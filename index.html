
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piped API Checker</title>
<style>
body {
  font-family: sans-serif;
  background: #111827;
  color: white;
  padding: 20px;
}
h1 { font-size: 24px; }
button {
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}
#start { background: #2563eb; color: white; }
#copy { background: #374151; color: white; }
#progress {
  background: #374151;
  height: 10px;
  border-radius: 10px;
  overflow: hidden;
}
#bar {
  background: #3b82f6;
  height: 100%;
  width: 0%;
}
.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.stat {
  background: #1f2937;
  padding: 15px;
  border-radius: 10px;
  flex: 1;
  min-width: 90px;
}
.num { font-size: 25px; font-weight: bold; }
#results {
  margin-top: 20px;
}
.item {
  background: #1f2937;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  overflow-wrap: anywhere;
}
.success { border-left: 5px solid #22c55e; }
.failed { border-left: 5px solid #ef4444; }
.unknown { border-left: 5px solid #eab308; }
.small { color: #9ca3af; font-size: 13px; }
</style>
</head>
<body>

<h1>Piped API Checker</h1>
<p>動画ID: aqz-KE-BPKQ</p>

<button id="start" onclick="startTest()">検査開始</button>
<button id="copy" onclick="copyResults()">結果をコピー</button>

<div class="stats">
  <div class="stat">
    成功
    <div class="num" id="success">0</div>
  </div>
  <div class="stat">
    失敗
    <div class="num" id="failed">0</div>
  </div>
  <div class="stat">
    判定不能
    <div class="num" id="unknown">0</div>
  </div>
  <div class="stat">
    検査済み
    <div class="num" id="checked">0</div>
  </div>
</div>

<br>
<div id="progress"><div id="bar"></div></div>
<p id="status">待機中</p>

<div id="results"></div>

<script>
const servers = [
  "https://pipedapi.kavin.rocks",
  "https://pipedapi.leptons.xyz",
  "https://pipedapi.nosebs.ru",
  "https://pipedapi-libre.kavin.rocks",
  "https://piped-api.privacy.com.de",
  "https://pipedapi.adminforge.de",
  "https://api.piped.yt",
  "https://pipedapi.drgns.space",
  "https://pipedapi.owo.si",
  "https://pipedapi.ducks.party",
  "https://piped-api.codespace.cz",
  "https://pipedapi.reallyaweso.me",
  "https://api.piped.private.coffee",
  "https://pipedapi.darkness.services",
  "https://pipedapi.orangenet.cc",
  "https://pipedapi.tokhmi.xyz",
  "https://pipedapi.moomoo.me",
  "https://pa.il.ax",
  "https://pa.mint.lgbt",
  "https://pipedapi.syncpundit.io"
];

const videoId = "aqz-KE-BPKQ";
let results = [];

async function testServer(base) {
  const url = base + "/streams/" + videoId;

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);

    const response = await fetch(url, {
      method: "GET",
      signal: controller.signal,
      cache: "no-store"
    });

    clearTimeout(timer);

    if (!response.ok) {
      return {
        server: base,
        url,
        result: "failed",
        status: response.status,
        error: "HTTP " + response.status
      };
    }

    const data = await response.json();

    if (data && typeof data === "object" &&
        (Array.isArray(data.audioStreams) ||
         Array.isArray(data.videoStreams) ||
         Array.isArray(data.relatedStreams))) {
      return {
        server: base,
        url,
        result: "success",
        status: response.status,
        data
      };
    }

    return {
      server: base,
      url,
      result: "failed",
      status: response.status,
      error: "JSON形式だが動画情報の構造が違う"
    };

  } catch (e) {
    return {
      server: base,
      url,
      result: "unknown",
      error: e.name === "AbortError"
        ? "タイムアウト"
        : e.message
    };
  }
}

async function startTest() {
  results = [];
  document.getElementById("results").innerHTML = "";
  document.getElementById("start").disabled = true;

  const total = servers.length;
  let index = 0;

  async function worker() {
    while (index < total) {
      const current = index++;
      const result = await testServer(servers[current]);

      results[current] = result;
      renderResult(result);

      const done = results.filter(Boolean).length;

      document.getElementById("checked").textContent = done;
      document.getElementById("success").textContent =
        results.filter(x => x?.result === "success").length;
      document.getElementById("failed").textContent =
        results.filter(x => x?.result === "failed").length;
      document.getElementById("unknown").textContent =
        results.filter(x => x?.result === "unknown").length;

      document.getElementById("bar").style.width =
        (done / total * 100) + "%";

      document.getElementById("status").textContent =
        done + " / " + total + " 検査完了";
    }
  }

  await Promise.all(
    Array.from({length: 5}, () => worker())
  );

  document.getElementById("status").textContent =
    "すべての検査が完了しました";

  document.getElementById("start").disabled = false;
}

function renderResult(r) {
  const div = document.createElement("div");
  div.className = "item " + r.result;

  const labels = {
    success: "成功",
    failed: "失敗",
    unknown: "判定不能"
  };

  div.innerHTML = "";

  const title = document.createElement("strong");
  title.textContent = labels[r.result];

  const url = document.createElement("div");
  url.className = "small";
  url.textContent = r.url;

  const detail = document.createElement("div");
  detail.textContent =
    "HTTP: " + (r.status ?? "取得不可") +
    " / " + (r.error ?? "正常な動画JSONを確認");

  div.append(title, url, detail);

  document.getElementById("results").appendChild(div);
}

async function copyResults() {
  const output = results.filter(Boolean).map(r => ({
    server: r.server,
    url: r.url,
    result: r.result,
    status: r.status ?? null,
    error: r.error ?? null
  }));

  await navigator.clipboard.writeText(
    JSON.stringify(output, null, 2)
  );

  alert("検査結果をコピーしました");
}
</script>

</body>
</html>
